# Committed on purpose: it holds no credentials.
#
# One profile, two outputs, one project. The BigQuery credentials are read from
# the environment; the Spark endpoint is a local Thrift Server with no secret.
# dbt is pointed at this file with DBT_PROFILES_DIR, so `~/.dbt/profiles.yml`
# is never involved.
bq_spark_experiments:
  # The target that works on this machine without a cloud credential.
  target: spark
  outputs:
    # ------------------------------------------------------------------- spark
    # A real Spark 4.2.0 Thrift Server (HiveServer2) on 127.0.0.1:10000, started
    # by scripts/start_spark.sh. Measured facts that shape this block:
    #   * the spark adapter is experimental in dbt-oss 2.0.5 and is refused
    #     unless DBT_ALLOW_EXPERIMENTAL_ADAPTERS=true is exported;
    #   * there is no `method: session` (in-process PySpark): the adapter
    #     accepts only thrift, http, livy and spark-connect;
    #   * `user` is required ("'user' is required when auth is 'PLAIN' or 'NONE'").
    # The session reads back current_catalog()=spark_catalog and
    # current_timezone()=UTC; the UTC session is what makes a Spark TIMESTAMP
    # render the same instant as a BigQuery one (see to_utc_timestamp).
    spark:
      type: spark
      method: thrift
      host: 127.0.0.1
      port: 10000
      user: hermes
      # `database` is the Spark catalog, `schema` is the Spark database.
      database: spark_catalog
      schema: bq_spark_experiments
      threads: 2

    # ---------------------------------------------------------------- bigquery
    # Copied from the root project's bigquery output.
    #
    # Auth is selectable from the environment so no secret or machine-specific
    # path is ever committed:
    #   * default            -> method: oauth (Application Default Credentials;
    #                           `gcloud auth application-default login`)
    #   * BQ_KEYFILE=<path>  -> method: service-account with that key file
    #     (optionally BQ_AUTH_METHOD=service-account to force it)
    bigquery:
      type: bigquery
      method: "{{ env_var('BQ_AUTH_METHOD', 'oauth') }}"
      keyfile: "{{ env_var('BQ_KEYFILE', '') }}"
      # `database` is the GCP project, `schema` is the dataset (dbt v2 naming).
      database: coreychimpbot
      schema: "experiments_{{ env_var('DBT_ENV', 'dev') }}"
      location: US
      threads: 4
      # Hard cost ceiling: a query that would bill more than this FAILS instead
      # of running. 1 GB by default; raise it deliberately, never silently.
      maximum_bytes_billed: "{{ env_var('BQ_MAXIMUM_BYTES_BILLED', 1000000000) | int }}"
