# The second, independent two-engine project beside the root one: the same
# model tree built against BigQuery and Spark (SPEC.md). Same layout and model
# config as the root project's dbt_project.yml; its own name and profile, so
# the root project's files and guardrail are never involved.
#
# The spark adapter is experimental in dbt-oss 2.0.5: every dbt call needs
# DBT_ALLOW_EXPERIMENTAL_ADAPTERS=true and DBT_PROFILES_DIR pointing here.
name: bq_spark_experiments

profile: bq_spark_experiments

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

clean-targets:
  - "target"
  - "dbt_packages"
  - "dbt_internal_packages"

# The whole point of the project: the SAME model tree is built against both
# targets. Anything dialect-specific belongs in macros/, not in a forked model.
models:
  bq_spark_experiments:
    +static_analysis: strict
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
