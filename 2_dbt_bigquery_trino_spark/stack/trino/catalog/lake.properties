# `lake`: the Iceberg lakehouse Trino SHARES with Spark.
#
# Both engines resolve table names through the same Iceberg REST catalog and read and
# write the same Parquet files in the same bucket. This is how Trino "reaches" Spark's
# data: not by sending SQL to Spark, but by reading the tables Spark wrote (and Spark
# reads the tables dbt-on-Trino writes).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.file-format=PARQUET
fs.native-s3.enabled=true
s3.endpoint=http://storage:8333
s3.path-style-access=true
s3.region=us-east-1
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
# Trino's Parquet writer uses Parquet v2 encodings (DELTA_LENGTH_BYTE_ARRAY for text),
# which Iceberg's VECTORIZED Spark reader cannot decode ("Cannot support vectorized reads
# for column ... with encoding DELTA_LENGTH_BYTE_ARRAY", apache/iceberg#7162). The fix
# that needs no Spark-side configuration is the Iceberg table property
# read.parquet.vectorization.enabled=false on every table dbt writes; Trino only lets a
# CREATE TABLE set an arbitrary Iceberg property that is allow-listed here.
iceberg.allowed-extra-properties=read.parquet.vectorization.enabled
