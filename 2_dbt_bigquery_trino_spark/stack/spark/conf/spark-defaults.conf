# Spark's view of the SAME lakehouse Trino uses: catalog `lake` = the Iceberg REST
# catalog, files in the same S3 bucket. Names match Trino's catalog name on purpose, so
# `lake.analytics.fct_orders` means the same table on both engines.
spark.jars                                  /opt/stack/spark/jars/iceberg-spark-runtime-4.0_2.13-1.10.0.jar,/opt/stack/spark/jars/iceberg-aws-bundle-1.10.0.jar
spark.sql.extensions                        org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                      org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type                 rest
spark.sql.catalog.lake.uri                  http://iceberg-rest:8181
spark.sql.catalog.lake.io-impl              org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint          http://storage:8333
spark.sql.catalog.lake.s3.path-style-access true
spark.sql.defaultCatalog                    lake
# Instants render and bucket in UTC, as on BigQuery and Trino (see docs/challenges.md).
spark.sql.session.timeZone                  UTC
spark.master                                local[2]
spark.driver.memory                         2g
spark.ui.enabled                            false
# No Hive: the only catalog that matters is `lake`. Without this, spark-sql starts an
# embedded Derby metastore in the (read-only) working directory and fails.
spark.sql.catalogImplementation             in-memory
